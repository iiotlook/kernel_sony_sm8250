name: Sync ArchieMeng Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArchieMeng kernel
        uses: actions/checkout@v4
        with:
          repository: ArchieMeng/kernel_sony_sm8250
          ref: droidian
          fetch-depth: 0

      - name: Apply custom configurations
        run: |
          # 1. Allow bridging wireless interfaces
          sed -i 's/if (dev->priv_flags & IFF_DONT_BRIDGE)/if (0 \&\& dev->priv_flags \& IFF_DONT_BRIDGE)/g' net/bridge/br_if.c

          # 2. Append extra configs
          cat << 'CONF' >> droidian/extra.config

# Cgroup
CONFIG_CPUSETS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_CGROUP_HUGETLB=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_BLK_DEV_THROTTLING=y

# Iptables & Networking
CONFIG_BRIDGE_NETFILTER=y
CONFIG_IP6_NF_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_MATCH_IPVS=y
CONFIG_IP6_NF_NAT=y
CONFIG_IPVLAN=y
CONFIG_MACVLAN=y
CONFIG_DUMMY=y

# Android
CONFIG_ANDROID=y
CONFIG_ANDROID_BINDERFS=y
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
CONFIG_ASHMEM=y

# CD-ROM / ISO
CONFIG_ISO9660_FS=m
CONFIG_JOLIET=y
CONFIG_ZISOFS=y
CONFIG_UDF_FS=m
CONFIG_UDF_NLS=y

# CIFS
CONFIG_CIFS=y
CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
CONFIG_CIFS_XATTR=y

# KVM
CONFIG_HAVE_KVM_IRQCHIP=y
CONFIG_HAVE_KVM_IRQFD=y
CONFIG_HAVE_KVM_IRQ_ROUTING=y
CONFIG_HAVE_KVM_EVENTFD=y
CONFIG_KVM_MMIO=y
CONFIG_HAVE_KVM_MSI=y
CONFIG_HAVE_KVM_CPU_RELAX_INTERCEPT=y
CONFIG_KVM_VFIO=y
CONFIG_HAVE_KVM_ARCH_TLB_FLUSH_ALL=y
CONFIG_KVM_GENERIC_DIRTYLOG_READ_PROTECT=y
CONFIG_HAVE_KVM_IRQ_BYPASS=y
CONFIG_HAVE_KVM_VCPU_RUN_PID_CHANGE=y
CONFIG_IRQ_BYPASS_MANAGER=y
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_ARM_HOST=y
CONFIG_KVM_ARM_PMU=y
CONFIG_KVM_INDIRECT_VECTORS=y
CONFIG_VHOST_NET=y
CONFIG_VHOST=y
CONF

          git config user.name "iiotlook"
          git config user.email "iiotlook@outlook.com"
          git commit -am "feat(droidian): sync from ArchieMeng and apply iiotlook kernel configs"

      - name: Push to iiotlook repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add target https://x-access-token:${GH_TOKEN}@github.com/iiotlook/kernel_sony_sm8250.git
          git push -f target HEAD:droidian

      - name: Trigger Build CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml -R iiotlook/kernel_sony_sm8250 --ref droidian || true
